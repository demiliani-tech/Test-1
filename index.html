<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hood Runner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100dvh;
    overflow: hidden;
    font-family: 'Arial Black', sans-serif;
    touch-action: none;
    user-select: none;
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    max-height: 854px;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 16px;
    pointer-events: none;
    z-index: 10;
  }
  .score-box {
    background: rgba(0,0,0,0.6);
    border: 2px solid #FFD700;
    border-radius: 10px;
    padding: 6px 12px;
    color: #FFD700;
    font-size: 15px;
    font-weight: 900;
    text-shadow: 0 0 8px #FFD700;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 20;
  }
  #overlay h1 {
    font-size: 42px;
    color: #FFD700;
    text-shadow: 0 0 20px #FFD700, 0 4px 0 #8B6914;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  #overlay .sub {
    color: #ccc;
    font-size: 14px;
    margin-bottom: 30px;
    text-align: center;
    padding: 0 20px;
  }
  #startBtn {
    background: linear-gradient(180deg, #FFD700, #B8860B);
    color: #000;
    border: none;
    border-radius: 16px;
    padding: 18px 48px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,215,0,0.5);
    letter-spacing: 1px;
    transition: transform 0.1s;
  }
  #startBtn:active { transform: scale(0.95); }
  #highScore {
    color: #aaa;
    font-size: 13px;
    margin-top: 18px;
  }
  #controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 16px;
    z-index: 10;
    pointer-events: none;
  }
  .ctrl-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid rgba(255,215,0,0.6);
    background: rgba(0,0,0,0.5);
    color: #FFD700;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    cursor: pointer;
    transition: background 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:active, .ctrl-btn.pressed {
    background: rgba(255,215,0,0.3);
  }
  #dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  #dpad .row {
    display: flex;
    gap: 4px;
  }
  .dpad-btn {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    border: 2px solid rgba(255,215,0,0.5);
    background: rgba(0,0,0,0.5);
    color: #FFD700;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: all;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn.center { background: rgba(50,50,50,0.5); pointer-events: none; }
  .dpad-btn:active { background: rgba(255,215,0,0.3); }
  #gameOver {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.88);
    z-index: 20;
  }
  #gameOver h2 {
    font-size: 48px;
    color: #ff4444;
    text-shadow: 0 0 20px #ff0000;
    margin-bottom: 10px;
  }
  #gameOver .final {
    color: #FFD700;
    font-size: 20px;
    margin-bottom: 6px;
  }
  #gameOver .best {
    color: #aaa;
    font-size: 15px;
    margin-bottom: 30px;
  }
  #retryBtn {
    background: linear-gradient(180deg, #ff4444, #880000);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 16px 44px;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,0,0,0.4);
  }
  #retryBtn:active { transform: scale(0.95); }
  #levelBanner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #FFD700;
    font-size: 36px;
    font-weight: 900;
    text-shadow: 0 0 20px #FFD700;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    transition: opacity 0.3s;
    text-align: center;
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="canvas"></canvas>

  <div id="ui">
    <div class="score-box">💵 <span id="cashScore">0</span></div>
    <div class="score-box">❤️ <span id="livesDisplay">3</span></div>
    <div class="score-box">⛓️ <span id="chainScore">0</span></div>
  </div>

  <div id="overlay">
    <h1>HOOD RUNNER</h1>
    <p class="sub">Collect cash &amp; chains. Jump the cops.<br>Don't get caught slippin'.</p>
    <button id="startBtn">▶ PLAY</button>
    <div id="highScore">BEST: <span id="bestDisplay">0</span></div>
  </div>

  <div id="gameOver">
    <h2>BUSTED!</h2>
    <div class="final">SCORE: <span id="finalScore">0</span></div>
    <div class="best">BEST: <span id="finalBest">0</span></div>
    <button id="retryBtn">TRY AGAIN</button>
  </div>

  <div id="levelBanner"></div>

  <div id="controls">
    <div id="dpad">
      <div class="row"><div class="dpad-btn center"></div></div>
      <div class="row">
        <div class="dpad-btn" id="btnLeft">◀</div>
        <div class="dpad-btn center"></div>
        <div class="dpad-btn" id="btnRight">▶</div>
      </div>
    </div>
    <div class="ctrl-btn" id="btnJump">↑</div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
